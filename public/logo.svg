<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="logoIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0033" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="14" fill="url(#logoIconGrad)" />
    <!-- Play Triangle -->
    <path d="M23 18L39 28L23 38V18Z" fill="#FFFFFF" />
    <!-- Download Accent -->
    <path d="M37 34V42M37 42L33 38M37 42L41 38" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Logo Typography -->
  <text x="74" y="38" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.03em" fill="url(#textGrad)">
    YT<tspan fill="#FF2E54">Saver</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="75" y="52" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" letter-spacing="0.08em" fill="#94A3B8">
    HD VIDEO &amp; MP3
  </text>
</svg>
