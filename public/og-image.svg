<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117" />
      <stop offset="100%" stop-color="#181B26" />
    </linearGradient>
    <linearGradient id="ogGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0033" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0033" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="textShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="950" cy="180" r="320" fill="url(#ogGlow)" filter="blur(80px)" />
  <circle cx="200" cy="500" r="260" fill="url(#ogGlow)" filter="blur(90px)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Brand Logo & Badge -->
  <g transform="translate(100, 110)">
    <rect width="84" height="84" rx="22" fill="url(#badgeGrad)" />
    <path d="M34 26L60 42L34 58V26Z" fill="#FFFFFF" />
    <path d="M56 50V62M56 62L50 56M56 62L62 56" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="110" y="58" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.03em" fill="url(#textShine)">
      YT<tspan fill="#FF2E54">Saver</tspan>
    </text>
  </g>

  <!-- Headline -->
  <text x="100" y="290" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="56" letter-spacing="-0.03em" fill="#FFFFFF">
    Free YouTube Video &amp; MP3 Downloader
  </text>

  <!-- Subtitle -->
  <text x="100" y="360" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="26" fill="#94A3B8">
    Fast · High Definition (720p/1080p) · MP3 Audio · Zero Server Storage
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 440)">
    <!-- Pill 1 -->
    <rect width="190" height="54" rx="27" fill="#1E2333" stroke="#334155" stroke-width="1.5" />
    <text x="95" y="33" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="18" fill="#F8FAFC">⚡ Direct Stream</text>

    <!-- Pill 2 -->
    <g transform="translate(210, 0)">
      <rect width="210" height="54" rx="27" fill="#1E2333" stroke="#334155" stroke-width="1.5" />
      <text x="105" y="33" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="18" fill="#F8FAFC">🔒 Auto-Clean Queue</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(440, 0)">
      <rect width="190" height="54" rx="27" fill="#1E2333" stroke="#334155" stroke-width="1.5" />
      <text x="95" y="33" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="18" fill="#F8FAFC">🎬 MP4 &amp; MP3</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(650, 0)">
      <rect width="180" height="54" rx="27" fill="#1E2333" stroke="#334155" stroke-width="1.5" />
      <text x="90" y="33" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="18" fill="#F8FAFC">💯 100% Free</text>
    </g>
  </g>
</svg>
